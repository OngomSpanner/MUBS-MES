name: mubsme

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
      - --max-connections=150
    environment:
      MYSQL_DATABASE: mubs_super_admin
      MYSQL_USER: mubsme
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mubsme_mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s
    networks:
      - mubsme_db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://mubsme.mubs.ac.ug}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        LOW_MEMORY_BUILD: "1"
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: mubsme
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: mubs_super_admin
      NEXT_PUBLIC_API_URL: https://mubsme.mubs.ac.ug
    ports:
      - "127.0.0.1:3053:3000"
    volumes:
      - mubsme_uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mubsme_db
      - mubsme_out
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

volumes:
  mubsme_mysql:
  mubsme_uploads:

networks:
  mubsme_db:
    name: mubsme_db
    internal: true
  mubsme_out:
    name: mubsme_out
