# Reverse proxy for MUBS M&E. App listens on 127.0.0.1:3053 only.
limit_req_zone $binary_remote_addr zone=mubsme_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mubsme.mubs.ac.ug;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://mubsme.mubs.ac.ug$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mubsme.mubs.ac.ug;

    server_tokens off;
    client_max_body_size 50m;

    ssl_certificate /etc/letsencrypt/live/mubsme.mubs.ac.ug/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mubsme.mubs.ac.ug/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/health {
        proxy_pass http://127.0.0.1:3053;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }

    location /api/auth/ {
        limit_req zone=mubsme_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:3053;
        include /etc/nginx/conf.d/mubsme.proxy.inc;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3053;
        include /etc/nginx/conf.d/mubsme.proxy.inc;
    }
}
