# Temporary HTTP vhost for ACME / pre-DNS cutover. Replaced by mubsme.conf after TLS.
server {
    listen 80;
    listen [::]:80;
    server_name mubsme.mubs.ac.ug;
    server_tokens off;
    client_max_body_size 50m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        proxy_pass http://127.0.0.1:3053;
        include /etc/nginx/conf.d/mubsme.proxy.inc;
    }
}
